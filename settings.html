<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="libs/bootstrap.min.css" rel="stylesheet">
    <script src="libs/bootstrap.min.js"></script>
    <script src="libs/jquery-3.7.1.min.js"></script>
    <script src="libs/feather.min.js"></script>
    <script src="localization.js"></script>
	<script src="script.js"></script>
	<script src="settings.js"></script>

    <title data-i18n="settings_title">Settings</title>
    <style>
        body {
            padding: 20px;
            font-family: 'Roboto', sans-serif;
            background-color: #f8f9fa;
            color: #212529;
        }
        .dark-mode {
            background-color: #000000;
            color: #ffffff;
        }
        .dark-mode .container {
            background-color: #1c1c1c;
        }
        .dark-mode .form-check-label {
            color: #ffffff;
        }
        .dark-mode .btn {
            background-color: #444444;
            color: #ffffff;
            border: none;
        }
        .dark-mode .form-control {
            background-color: #333333;
            color: #ffffff;
            border: 1px solid #555555;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 data-i18n="settings_title">
            <i data-feather="settings"></i> Settings
        </h1>
        <div class="form-group form-check">
            <input id="darkModeToggle" type="checkbox" class="form-check-input">
            <label class="form-check-label" for="darkModeToggle" data-i18n="enable_dark_mode">
                <i data-feather="moon"></i> Enable Dark Mode
            </label>
        </div>
    </div>	
</body>

</html>
